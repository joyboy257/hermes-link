[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-link"
version = "1.0.0"
description = "Skill marketplace CLI for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "hermes-link", email = "hermes-link@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hermes-link = "hermes_link.cli:main"

[project.urls]
Homepage = "https://github.com/joyboy257/hermes-link"
Repository = "https://github.com/joyboy257/hermes-link"
Issues = "https://github.com/joyboy257/hermes-link/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_link*"]
